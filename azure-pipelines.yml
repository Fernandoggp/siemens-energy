# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
  - stage:
    displayName: 'Build Stage'
    jobs:
      - job: BuildJob
        steps:
          - checkout: self
          - task: UseDotNet@2
            displayName: 'Install sdk'
            inputs:
              packageType: sdk
              version: '8.0.x'

          - task: DotNetCoreCLI@2
            displayName: 'Restore'
            inputs:
              command: 'restore'
              projects: '**/*.csproj' 

          - task: DotNetCoreCLI@2
            displayName: 'build'
            inputs:
              command: build
              projects: '**/*.csproj' 
            
            
